"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build:preview"
  publish = "dist"

[functions]
  directory = "netlify/preview-functions"
  node_bundler = "esbuild"

[context.production]
  command = "npm run build:production"

[context.production.functions]
  directory = "functions"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile"
